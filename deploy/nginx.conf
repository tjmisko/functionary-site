# Functionary marketing site — nginx server block.
# Copy to /etc/nginx/sites-available/functionary-site, symlink into
# sites-enabled, then `nginx -t && systemctl reload nginx`.
#
# TLS: run `certbot --nginx -d functionary.app -d www.functionary.app`
# once the DNS A/AAAA records point at this VPS. Certbot rewrites the
# server blocks below to add the 443 listener + redirect.

server {
    listen 80;
    listen [::]:80;
    server_name functionary.app www.functionary.app;

    root /var/www/functionary-site;
    index index.html;

    access_log /var/log/nginx/functionary.app.access.log;
    error_log  /var/log/nginx/functionary.app.error.log;

    # Repeat these in locations that set Cache-Control below: on widely
    # deployed nginx versions, any location-level add_header disables
    # inheritance of all server-level add_header directives.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Long-cache hashed assets (Astro fingerprints filenames in /_astro/).
    location /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # HTML is cheap and changes on deploy — keep it fresh.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Compression (brotli requires the ngx_brotli module; gzip is built-in).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css application/javascript application/json
        image/svg+xml application/xml;

    # Don't serve dotfiles. Allow only the ACME challenge directory so
    # Certbot can renew the certificate over HTTP.
    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
    }
}
